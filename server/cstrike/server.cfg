// ============================================================
// CS 1.6 — servidor dedicado ReHLDS + ReGameDLL_CS
// Configuração básica para jogo local/LAN
// ============================================================

hostname "CS 1.6 — ReHLDS local"

// --- Rede -----------------------------------------------------
// sv_lan 1: sem autenticação Steam (ideal p/ jogar em casa)
sv_lan 1
sv_region 255
sv_maxspeed 320
pausable 0
sv_aim 0
sv_maxrate 100000
sv_minrate 25000
sv_maxupdaterate 102
sv_minupdaterate 66
sys_ticrate 1000

// --- RCON (troque a senha!) ------------------------------------
rcon_password "mudar-esta-senha"

// --- Gameplay ---------------------------------------------------
mp_timelimit 30
mp_roundtime 4
mp_freezetime 4
mp_c4timer 35
mp_autoteambalance 1
mp_limitteams 1
mp_friendlyfire 0
mp_autokick 0
mp_tkpunish 0
mp_hostagepenalty 0
mp_forcecamera 0
mp_flashlight 1
mp_footsteps 1
mp_startmoney 800
mp_buytime 1.5
mp_fraglimit 0
mp_maxrounds 0
mp_winlimit 0
mp_chattime 10

// --- Servidor ---------------------------------------------------
sv_cheats 0
sv_timeout 65
allow_spectators 1
mp_consistency 1
edgefriction 2

// Logs
log on
mp_logdetail 0
mp_logmessages 0

// Ban lists (executadas se existirem)
exec listip.cfg
exec banned.cfg

// Bots + "cérebro lento" (Jev/TypeSafe). Roda aqui porque o server.cfg é
// executado depois que o game DLL registra os cvars bot_*; a linha abaixo
// liga os bots e o advisor (ver server/cstrike/advisor.cfg).
exec advisor.cfg
