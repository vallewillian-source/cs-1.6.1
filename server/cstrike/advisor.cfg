// advisor.cfg -- bots + "slow brain" for the V1 Jev bots (de_dust2, defuse)
//
// Loaded by scripts/run-botbrain.sh with  +exec advisor.cfg  (after the map).
// Requires "bot_enable 1" in game_init.cfg, which runs before the game DLL
// registers its bot cvars -- without it none of the bot_* commands exist on a
// dedicated server.

// --- bots on the dedicated server ---------------------------------------
bot_join_after_player 0     // no human will connect (headless test/match)
bot_quota_mode normal
bot_quota 8                 // 4 v 4
bot_difficulty 2            // 0 easy .. 3 expert
mp_autoteambalance 0
mp_limitteams 0

// --- the advisor (cs_bot_advisor) ---------------------------------------
advisor_enable 1            // 0 = byte-for-byte stock behaviour
advisor_debug 1             // echo the observe/plan/apply trace to the server console
// advisor_force_intent RUSH_B   // uncomment to drive the DLL half without the sidecar
// advisor_poll_interval 0.5     // how often plan_<team>.txt is polled (s)
// advisor_heartbeat 3.0         // how often a quiet round re-writes its observation (s)
