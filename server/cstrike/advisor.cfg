// advisor.cfg -- bots + "slow brain" for the V1 Jev bots (de_dust2, defuse)
//
// Loaded by scripts/run-botbrain.sh with  +exec advisor.cfg  (after the map).
// Requires "bot_enable 1" in game_init.cfg, which runs before the game DLL
// registers its bot cvars -- without it none of the bot_* commands exist on a
// dedicated server.

// --- bots on the dedicated server ---------------------------------------
bot_join_after_player 0     // no human will connect (headless test/match)
bot_quota_mode normal
bot_quota 8                 // 4 v 4
bot_difficulty 2            // 0 easy .. 3 expert
mp_autoteambalance 0
mp_limitteams 0

// Compatibility bot settings only. Jev activation belongs to game/mods/bots-jev.
