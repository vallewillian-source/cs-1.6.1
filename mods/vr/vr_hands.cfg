# Viewmodel proprio (bracos WRAD ARMS + arma Quaternius) — V2: mao, coldre e 2 maos.
# Salvar este arquivo JA e aplicado: o mod rele por mtime (~1x/s) e RECARREGA os
# assets, entao da para ajustar encaixe/escala/eixos e ver a folha de contato sem
# reiniciar o jogo.
#
# Unidades: tudo em unidades GoldSrc (~polegadas; 39,37 = 1 metro), salvo onde diz cm.

enable 1                # 0 desliga (volta ao viewmodel do jogo)

# --- assets (relativos a pasta do jogo, que e o cwd do xash3d) ---
arms_glb     mods/vr_assets/arms.glb
arms_tex     mods/vr_assets/arm_albedo_pale.png
weapon_obj   mods/vr_assets/Pistol_1.obj

# --- eixos do ASSET: "frente cima direita" DENTRO do arquivo ---
# WRAD (glTF): frente -Z, cima +Y, direita +X.  Quaternius (OBJ): frente +X.
# Um asset com a convencao errada aqui aparece deitado/virado — e o que era o bug
# da pistola "de lado, com a traseira para a frente".
arms_axes    -Z +Y +X
weapon_axes  +X +Y +Z

# --- escala ---
# O alvo e o comprimento REAL da arma: a escala sai de comprimento_alvo / o que o
# modelo mede. Assim nenhum asset precisa de numero magico (e aconteceu do numero
# magico ser aplicado duas vezes, deixando a arma 4,2x maior).
scale_arms         4.2    # rig -> GoldSrc (alcance do braco 5,20 un. ~ 22 un. reais)
weapon_length_cm   19     # comprimento real alvo em cm (USP ~21,8 / Glock18 ~18,6)
weapon_scale_res   1      # residuo multiplicativo (1 = so o comprimento manda)

# --- encaixe na mao: referencial DA MAO (frente = cano, esquerda, cima do controle) ---
# weapon_grip e o ponto de empunhadura DENTRO do modelo (medido no Pistol_1.obj:
# centroide do aglomerado do cabo, x<0,21 e y<0 -> -0,109 -0,252 0,000; ver
# assets/SOURCES.md). Ele cai no centro da palma; o resto e residuo de gosto.
weapon_grip  -0.10 -0.23 0
weapon_off    0 0 0        # unidades GoldSrc: frente esquerda cima
weapon_euler  0 0 0        # graus: pitch = BOCA PARA CIMA, yaw, roll (canted)

# --- duas maos: onde a mao de apoio vai, no referencial da palma da mao de tras ---
support_fwd   1.6
support_side  -1.4      # lado, no referencial da EMPUNHADURA (positivo = a esquerda da arma = onde a palma olha)
support_up    0

# --- dedos: o eixo de flexao e derivado do rig; estes numeros so dizem o QUANTO ---
curl_max     85 95 75    # falanges 1/2/3, em graus (no fechamento total)
curl_pinky   1.0
curl_ring    1.0
curl_middle  0.95
curl_index   0.85
curl_thumb   0.6
curl_fist    0.75        # fechamento minimo da mao que SEGURA a arma

# --- estado da arma / coldre / chao (unidades GoldSrc; 2,54 un. = 1 cm... ~2,54cm) ---
grip_th         0.6      # squeeze acima disto conta como "apertado"
holster_fwd     10       # coldre: a frente do olho
holster_down    22       # ... e abaixo (22 un. ~ 56 cm: a barriga)
holster_side    0        # ... e para o lado (positivo = direita)
holster_euler  -70 0 0   # pose guardada (pitch negativo = boca para BAIXO)
holster_radius  9        # soltar a arma a menos disto da barriga = guardar no coldre
grab_radius     7        # grip apertado a menos disto da arma = pegar
grab_hyst       1.7      # histerese: soltar exige 1,7x o raio de pegar
two_hand_radius 6        # a mao de apoio tem de estar a menos disto da arma
two_hand_blend  0.5      # 0 = so a mao de tras manda no cano; 1 = so a de apoio
wrist_roll      1        # roll do punho: 1 = o do CONTROLE (segura o controle de cabo em pe -> arma em pe) | 0 = do braco (repouso do rig, deita a arma)
drop_gravity    386      # un/s^2 (9,8 m/s^2)
drop_eye_height 28       # altura dos olhos -> plano do chao onde a arma largada cai

# --- recuo visual (o recuo que DESVIA o tiro e do jogo; este e o retorno visual) ---
recoil_deg      7
recoil_kick     0.9      # unidades GoldSrc para tras, no eixo do cano
recoil_interval 0.09     # s entre impulsos com o gatilho preso

# --- regra de jogo ---
# Com a arma fora da mao (coldre/chao) o gatilho NAO atira: e o que da sentido a
# guardar/soltar. So vale para a classe que este subsistema desenha (pistol); com
# outro tipo de arma equipada nada muda. 0 = volta a atirar sempre.
enforce_armed  1

# --- profundidade: casar com o ref do engine, senao a oclusao sai errada ---
near  4                  # gl_rmain.c: zNear = 4.0f
far   7086               # gl_rmain.c: max(256, movevars.zmax * 1.73)
color_gamma 2.2          # o Kd do MTL e linear e escuro; isto o traz para sRGB

# --- diagnostico (sem headset): ligado por VR_HANDS_TEST=1 no ambiente ---
# sheet: fit (o encaixe girando) | weapon (a arma + marcadores da empunhadura) |
#        curl (os dedos em 4 niveis) | states (na mao / 2 maos / coldre / chao) |
#        walk (roteiro pela maquina de estados: pegar/guardar/largar) | 0 (desligado)
# A folha sai no dump do painel (VR_PANEL_DUMP) — ver docs/HANDS.md.
sheet        0
synth_hands  0           # 1 = ignora os controles e usa duas maos de mentira
synth_grip   1.0         # grip da mao de tras na folha (a de apoio fica aberta)
synth_dist   16          # mao sintetica: a frente do corpo (tem de ficar DENTRO do alcance ~22)
synth_side   5.5         # ... e para o lado
synth_down   9           # ... e abaixo
