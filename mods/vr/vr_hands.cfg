# Viewmodel proprio (bracos WRAD ARMS + arma Quaternius) — V1, classe "pistol".
# Salvar este arquivo JA e aplicado (o mod rele por mtime, ~1x/s), sem reiniciar.
#
# Unidades: tudo em unidades GoldSrc (~polegadas; 39.37 = 1 metro).
#
# ESCALA: os assets vem no espaco do autor. Dois numeros medidos no rig:
#   - alcance do braco (biceps->punho) = 5,20 unidades do modelo; um braco real
#     (braco + antebraco) ~ 55 cm ~ 22 unidades GoldSrc  ->  escala ~ 4,2
#   - a pistola mede 1,82 unidades do modelo; 1,82 * 4,2 = 7,6 unidades = 19 cm
# Os dois batem, entao 4,2 e o ponto de partida. Ajuste COM O HEADSET.

enable 1                # 0 desliga (volta ao viewmodel do jogo)

# --- assets (relativos a pasta do jogo, que e o cwd do xash3d) ---
arms_glb     mods/vr_assets/arms.glb
arms_tex     mods/vr_assets/arm_albedo_pale.png
weapon_obj   mods/vr_assets/Pistol_1.obj

scale_arms    4.2
scale_weapon  4.2

# --- orientacao (graus) — ajuste fino por asset ---
arm_euler     0 0 0     # pitch yaw roll dos bracos (nao usado na pose por IK)
weapon_euler  0 0 0     # pitch yaw roll da arma dentro do socket da mao
rig_yaw       0         # giro fino do conjunto (ombros) em relacao ao olhar
weapon_off    0 0 0     # deslocamento da arma no referencial do soco (unidades)

# --- profundidade: casar com o ref do engine, senao a oclusao sai errada ---
near  4                 # gl_rmain.c: zNear = 4.0f
far   7086              # gl_rmain.c: max(256, movevars.zmax * 1.73)

color_gamma  2.2        # Kd do MTL e linear e escuro; isto o traz para sRGB
debug 0

# --- diagnostico (sem headset): ligado por VR_HANDS_TEST=1 no ambiente ---
synth_hands  0          # 1 = ignora os controles e usa duas maos de mentira
test_dist    40         # desenho estatico: distancia a frente
test_side    0
test_height  0
test_yaw     0
test_pitch   0
test_nodepth 1          # desenho estatico: ignora profundidade (sempre visivel)
test_flat    0          # 1 = cor chapada vermelha, sem textura (isola geometria)
