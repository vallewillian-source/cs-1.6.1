# Encaixe da arma na mao (etapa "arma na mao", ABI v6 do mod VR).
#
# A ORIGEM do viewmodel do CS e o OLHO do jogador e a geometria do modelo fica
# abaixo/a direita DISSO (inclusive a mao desenhada). Agora que a origem passa a
# ser a MAO, o modelo aparece deslocado por esse tanto — este arquivo e a
# correcao.
#
# Os valores sao um offset NO REFERENCIAL DA ARMA (nao do mundo), em unidades
# GoldSrc (~polegadas; 39.37 = 1 metro). Por ser no referencial da arma, o
# encaixe NAO muda quando voce gira o pulso:
#
#   X = frente (+) / tras (-)    -> desliza o modelo ao longo do cano
#   Y = direita (+) / esquerda (-)
#   Z = cima (+) / baixo (-)
#
# 'global' vale para todas as armas; 'class <nome>' sobrepoe uma classe. Uma
# linha invalida e ignorada com aviso no mods/mod_vr.log (o que ja valia continua
# valendo).
#
# Salvar este arquivo JA aplica: o mod rele a cada ~1s, sem reiniciar o jogo.
# O painel de debug (canto superior esquerdo do monitor) mostra a classe do
# modelo em uso e qual offset esta valendo — calibre olhando por ele.
#
# Classes e de quais armas do CS 1.6 cada uma vem:
#   pistol   deagle usp glock18 p228 fiveseven elite
#   smg      mp5 tmp mac10 ump45 p90
#   rifle    ak47 m4a1 sg552 aug galil famas
#   sniper   awp scout g3sg1 sg550
#   heavy    m249 xm1014 m3
#   knife    knife / knife_r
#   grenade  hegrenade flashbang smokegrenade
#   c4       c4
#   shield   shield_r
#   other    qualquer coisa que nao case acima

global 0 0 0

# Exemplos (descomente e ajuste com o headset na cara):
# class pistol  0 -6 4
# class rifle   0 -8 5
# class knife   0 -4 2
